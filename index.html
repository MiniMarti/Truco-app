<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS Magic Switch</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
        }

        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center top;
            z-index: 1;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 15px 12px;
            padding-top: calc(env(safe-area-inset-top, 40px) + 25px);
            padding-left: 22px;
            padding-right: 22px;
            padding-bottom: 25%;
            z-index: 2;
        }

        .app-touch-zone {
            width: 100%;
            height: 100%;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calc-icon {
            width: 62px;
            height: 62px;
            border-radius: 15px;
            background-color: #1c1c1e;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .calc-icon svg {
            width: 100%;
            height: 100%;
        }

        .show-calc .calc-icon {
            display: flex;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #secret-trigger {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100px;
            height: 100px;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="bg-container" id="bgContainer"></div>

    <div class="grid-overlay" id="gridOverlay"></div>

    <div id="secret-trigger"></div>

    <script>
        // Imagen de fondo en Base64
        const bgBase64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="; // Reemplazar por tu imagen directa o cargar via URL

        document.getElementById('bgContainer').style.backgroundImage = `url('${bgBase64}')`;

        const calcSVG = `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#1c1c1e"/><circle cx="30" cy="30" r="18" fill="#ff9f0a"/><text x="30" y="41" font-size="32" fill="#fff" text-anchor="middle" font-weight="bold">÷</text></svg>`;

        let selectedAppIndex = null;
        let isTransformed = false;

        const gridOverlay = document.getElementById('gridOverlay');

        for (let i = 0; i < 20; i++) {
            const zone = document.createElement('div');
            zone.className = 'app-touch-zone';
            zone.dataset.index = i;

            const calcDiv = document.createElement('div');
            calcDiv.className = 'calc-icon';
            calcDiv.innerHTML = calcSVG;
            zone.appendChild(calcDiv);

            zone.addEventListener('click', () => {
                if (selectedAppIndex !== null) return;
                selectedAppIndex = i;
                zone.classList.add('show-calc');
                if (navigator.vibrate) navigator.vibrate(50);
            });

            gridOverlay.appendChild(zone);
        }

        function triggerWaveTransformation() {
            if (selectedAppIndex === null || isTransformed) return;
            isTransformed = true;

            const allZones = document.querySelectorAll('.app-touch-zone');

            allZones.forEach((zone, index) => {
                setTimeout(() => {
                    zone.classList.add('show-calc');
                    if (navigator.vibrate) navigator.vibrate(20);
                }, index * 80);
            });
        }

        document.getElementById('secret-trigger').addEventListener('click', triggerWaveTransformation);

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchEndY - touchStartY > 40) {
                triggerWaveTransformation();
            }
        });
    </script>
</body>
</html>
