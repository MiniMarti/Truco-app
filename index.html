<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS 26 Dark Mode</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 50px) 20px env(safe-area-inset-bottom, 8px) 20px;
            position: relative;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px 14px;
            margin-top: 15px;
            z-index: 1;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.75), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.25),
                        inset 0 -1px 2px rgba(0, 0, 0, 0.8);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
        }

        .app-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .app-name {
            color: #EBEBF5;
            font-size: 11px;
            margin-top: 5px;
            text-align: center;
            font-weight: 400;
            letter-spacing: -0.2px;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        }

        .dock-wrapper {
            width: 100%;
            margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 2px);
            z-index: 1;
        }

        .dock-container {
            background: rgba(20, 20, 22, 0.65);
            backdrop-filter: blur(35px) saturate(210%);
            -webkit-backdrop-filter: blur(35px) saturate(210%);
            border-radius: 35px;
            padding: 12px 14px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .home-indicator {
            width: 138px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
            margin: 8px auto 2px auto;
            opacity: 0.9;
        }

        .app-icon.flip {
            transform: scale(1.15) rotate(6deg);
        }

        #secret-trigger {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 110px;
            height: 110px;
            z-index: 999;
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="secret-trigger"></div>

    <div class="apps-grid" id="appsGrid"></div>

    <div class="dock-wrapper">
        <div class="dock-container" id="dockGrid"></div>
        <div class="home-indicator"></div>
    </div>

        const initialApps = [
            { id: 'instagram', name: 'Instagram', svg: SVGS.instagram },

            { id: 'camera', name: 'Cámara', svg: SVGS.camera },

            { id: 'appstore', name: 'App Store', svg: SVGS.appstore },
            { id: 'google', name: 'Google', svg: SVGS.google }
        ];

        const intruderApp = { id: 'calculator', name: 'Calculadora', svg: SVGS.calculator };

        const dockApps = [
            { id: 'phone', name: 'Teléfono', svg: SVGS.phone },
            { id: 'safari', name: 'Safari', svg: SVGS.safari },
            { id: 'messages', name: 'Mensajes', svg: SVGS.messages },
            { id: 'music', name: 'Música', svg: SVGS.music }
        ];

        let thoughtApp = null;
        let isTransformed = false;

        function renderApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            
            initialApps.forEach((app) => {
                const el = document.createElement('div');
                el.className = 'app-item';
                el.onclick = () => onAppTapped(app, el);

                el.innerHTML = `
                    <div class="app-icon">${app.svg}</div>
                    <div class="app-name">${app.name}</div>
                `;
                grid.appendChild(el);
            });

            const dock = document.getElementById('dockGrid');
            dock.innerHTML = '';
            dockApps.forEach((app) => {
                const el = document.createElement('div');
                el.className = 'app-item';
                el.innerHTML = `<div class="app-icon">${app.svg}</div>`;
                dock.appendChild(el);
            });
        }

        function onAppTapped(app, element) {
            if (thoughtApp) return;

            thoughtApp = app;

            const iconDiv = element.querySelector('.app-icon');
            const nameDiv = element.querySelector('.app-name');

            iconDiv.classList.add('flip');

            setTimeout(() => {
                iconDiv.innerHTML = intruderApp.svg;
                if (nameDiv) nameDiv.textContent = intruderApp.name;
                iconDiv.classList.remove('flip');
            }, 180);

            if (navigator.vibrate) navigator.vibrate(50);
        }

        function triggerWaveTransformation() {
            if (!thoughtApp || isTransformed) return;
            isTransformed = true;

            const allAppElements = document.querySelectorAll('.apps-grid .app-item, .dock-container .app-item');
            
            allAppElements.forEach((el, index) => {
                setTimeout(() => {
                    const iconDiv = el.querySelector('.app-icon');
                    const nameDiv = el.querySelector('.app-name');

                    iconDiv.innerHTML = thoughtApp.svg;
                    iconDiv.classList.add('flip');

                    if (nameDiv) {
                        nameDiv.textContent = thoughtApp.name;
                    }

                    setTimeout(() => iconDiv.classList.remove('flip'), 250);

                    if (navigator.vibrate) navigator.vibrate(20);
                }, index * 110);
            });
        }

        document.getElementById('secret-trigger').addEventListener('click', triggerWaveTransformation);

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchEndY - touchStartY > 40) {
                triggerWaveTransformation();
            }
        });

        renderApps();
    </script>
