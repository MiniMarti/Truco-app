<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iPhone Screen</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 47px) 20px env(safe-area-inset-bottom, 10px) 20px;
            position: relative;
        }

        /* GRID PRINCIPAL (4 COLUMNAS) */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 18px;
            margin-top: 15px;
            z-index: 1;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-icon svg {
            width: 100%;
            height: 100%;
            border-radius: 14px;
        }

        .app-name {
            color: #ffffff;
            font-size: 11px;
            margin-top: 5px;
            text-align: center;
            font-weight: 400;
            letter-spacing: -0.2px;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* DOCK PEGANTE ABAJO */
        .dock-wrapper {
            width: 100%;
            margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 5px);
            z-index: 1;
        }

        .dock-container {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: 32px;
            padding: 13px 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        /* BARRA HOME */
        .home-indicator {
            width: 135px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
            margin: 8px auto 2px auto;
        }

        .app-icon.flip {
            transform: scale(1.12) rotate(4deg);
        }

        /* BOTÓN INVISIBLE ESQUINA INFERIOR DERECHA */
        #secret-trigger {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 120px;
            height: 120px;
            z-index: 999;
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="secret-trigger"></div>

    <div class="apps-grid" id="appsGrid"></div>

    <div class="dock-wrapper">
        <div class="dock-container" id="dockGrid"></div>
        <div class="home-indicator"></div>
    </div>

    <script>
        // Diseños SVG de alta fidelidad iOS
        const SVGS = {
            photos: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#fff"/><g transform="translate(10,10) scale(0.66)"><path fill="#FF3B30" d="M30 15c0-8.28-6.72-15-15-15S0 6.72 0 15c0 3.8 1.41 7.27 3.75 9.92L30 15z"/><path fill="#FF9500" d="M45 30c8.28 0 15-6.72 15-15S53.28 0 45 0c-3.8 0-7.27 1.41-9.92 3.75L45 30z"/><path fill="#FFCC00" d="M30 45c0 8.28 6.72 15 15 15s15-6.72 15-15c0-3.8-1.41-7.27-3.75-9.92L30 45z"/><path fill="#34C759" d="M15 30c-8.28 0-15 6.72-15 15s6.72 15 15 15c3.8 0 7.27-1.41 9.92-3.75L15 30z"/><path fill="#007AFF" d="M30 15c0 8.28-6.72 15-15 15s-15-6.72-15-15c0-3.8 1.41-7.27 3.75-9.92L30 15z" opacity="0.9"/><path fill="#5856D6" d="M45 30c0 8.28-6.72 15-15 15s-15-6.72-15-15c0-3.8 1.41-7.27 3.75-9.92L45 30z" opacity="0.9"/></g></svg>`,
            camera: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#999"/><radialGradient id="cg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eeeeee"/><stop offset="100%" stop-color="#999999"/></radialGradient><rect width="60" height="60" rx="14" fill="url(#cg)"/><circle cx="30" cy="32" r="16" fill="#1c1c1e"/><circle cx="30" cy="32" r="12" fill="#0a84ff"/><circle cx="30" cy="32" r="6" fill="#000"/><circle cx="43" cy="20" r="3" fill="#ff453a"/></svg>`,
            mail: `<svg viewBox="0 0 60 60"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#64b5f6"/><stop offset="100%" stop-color="#1e88e5"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#mg)"/><path d="M12 20l18 13 18-13v20H12V20z" fill="#fff" opacity="0.9"/><path d="M12 20l18 13 18-13" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round"/></svg>`,
            settings: `<svg viewBox="0 0 60 60"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8e8e93"/><stop offset="100%" stop-color="#636366"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#sg)"/><circle cx="30" cy="30" r="14" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="6 3"/><circle cx="30" cy="30" r="8" fill="#fff"/></svg>`,
            notes: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#fff"/><rect width="60" height="14" fill="#fbc02d"/><line x1="12" y1="24" x2="48" y2="24" stroke="#e0e0e0" stroke-width="2"/><line x1="12" y1="34" x2="48" y2="34" stroke="#e0e0e0" stroke-width="2"/><line x1="12" y1="44" x2="48" y2="44" stroke="#e0e0e0" stroke-width="2"/></svg>`,
            weather: `<svg viewBox="0 0 60 60"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#517fa4"/><stop offset="100%" stop-color="#243949"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#wg)"/><circle cx="24" cy="24" r="10" fill="#ffcc00"/><path d="M22 40a8 8 0 0 1 0-16 10 10 0 0 1 19 3 7 7 0 0 1-3 13z" fill="#fff" opacity="0.9"/></svg>`,
            clock: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#000"/><circle cx="30" cy="30" r="24" fill="none" stroke="#fff" stroke-width="2"/><line x1="30" y1="30" x2="30" y2="14" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="30" x2="42" y2="30" stroke="#fff" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="30" x2="20" y2="38" stroke="#ff3b30" stroke-width="2"/></svg>`,
            maps: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#81c784"/><path d="M0 20l20-10 20 10 20-10v40l-20 10-20-10L0 60V20z" fill="#a5d6a7"/><path d="M30 10v40" stroke="#ff5252" stroke-width="4"/><path d="M10 30h40" stroke="#fff" stroke-width="5"/></svg>`,
            health: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#fff"/><path d="M30 46S14 34 14 22a8 8 0 0 1 14-5l2 3 2-3a8 8 0 0 1 14 5c0 12-16 24-16 24z" fill="#ff2d55"/></svg>`,
            wallet: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#1c1c1e"/><rect x="8" y="16" width="44" height="28" rx="5" fill="#34c759"/><rect x="8" y="22" width="44" height="28" rx="5" fill="#007aff"/><rect x="8" y="28" width="44" height="28" rx="5" fill="#ff9500"/></svg>`,
            appstore: `<svg viewBox="0 0 60 60"><defs><linearGradient id="asg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#187afe"/><stop offset="100%" stop-color="#0055d4"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#asg)"/><path d="M30 12l4 8h-8zM20 44l10-20 4 8H14zM40 44H20l4-8h20z" fill="#fff"/></svg>`,
            calculator: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#1c1c1e"/><rect x="10" y="10" width="40" height="40" rx="8" fill="#ff9500"/><text x="30" y="38" font-size="28" fill="#fff" text-anchor="middle" font-weight="bold">÷</text></svg>`,
            
            // DOCK
            phone: `<svg viewBox="0 0 60 60"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#62d773"/><stop offset="100%" stop-color="#28cd41"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#pg)"/><path d="M38 34c-2 0-4-1-5-2l-4 4c-5-3-9-7-12-12l4-4c-1-1-2-3-2-5 0-3 2-6 5-6 1 0 2 1 2 2l2 6c0 1 0 2-1 3l-2 2c3 5 7 9 12 12l2-2c1-1 2-1 3-1l6 2c1 0 2 1 2 2 0 3-3 5-6 5z" fill="#fff"/></svg>`,
            safari: `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="14" fill="#fff"/><circle cx="30" cy="30" r="24" fill="#007aff"/><polygon points="30,12 35,27 30,30" fill="#ff3b30"/><polygon points="30,48 25,33 30,30" fill="#fff"/><polygon points="30,12 25,27 30,30" fill="#ff3b30" opacity="0.6"/><polygon points="30,48 35,33 30,30" fill="#e5e5ea"/></svg>`,
            messages: `<svg viewBox="0 0 60 60"><defs><linearGradient id="msg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#62d773"/><stop offset="100%" stop-color="#28cd41"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#msg)"/><path d="M15 18c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8c-1.1 0-2.2-.2-3.2-.5L17 27l.8-3.4C16 22.2 15 20.2 15 18z" fill="#fff" transform="scale(1.2) translate(-4,-2)"/></svg>`,
            music: `<svg viewBox="0 0 60 60"><defs><linearGradient id="musg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff3b30"/><stop offset="100%" stop-color="#e02114"/></linearGradient></defs><rect width="60" height="60" rx="14" fill="url(#musg)"/><path d="M36 16v18.2c-1-.7-2.4-1.2-4-1.2-3.3 0-6 2.2-6 5s2.7 5 6 5 6-2.2 6-5V22l8-2v-4l-10 2z" fill="#fff"/></svg>`
        };

        const initialApps = [
            { id: 'photos', name: 'Fotos', svg: SVGS.photos },
            { id: 'camera', name: 'Cámara', svg: SVGS.camera },
            { id: 'mail', name: 'Mail', svg: SVGS.mail },
            { id: 'settings', name: 'Ajustes', svg: SVGS.settings },
            { id: 'notes', name: 'Notas', svg: SVGS.notes },
            { id: 'weather', name: 'Tiempo', svg: SVGS.weather },
            { id: 'clock', name: 'Reloj', svg: SVGS.clock },
            { id: 'maps', name: 'Mapas', svg: SVGS.maps },
            { id: 'health', name: 'Salud', svg: SVGS.health },
            { id: 'wallet', name: 'Cartera', svg: SVGS.wallet },
            { id: 'appstore', name: 'App Store', svg: SVGS.appstore }
        ];

        const intruderApp = { id: 'calculator', name: 'Calculadora', svg: SVGS.calculator };

        const dockApps = [
            { id: 'phone', name: 'Teléfono', svg: SVGS.phone },
            { id: 'safari', name: 'Safari', svg: SVGS.safari },
            { id: 'messages', name: 'Mensajes', svg: SVGS.messages },
            { id: 'music', name: 'Música', svg: SVGS.music }
        ];

        let thoughtApp = null;
        let isTransformed = false;

        function renderApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            
            initialApps.forEach((app) => {
                const el = document.createElement('div');
                el.className = 'app-item';
                el.onclick = () => onAppTapped(app, el);

                el.innerHTML = `
                    <div class="app-icon">${app.svg}</div>
                    <div class="app-name">${app.name}</div>
                `;
                grid.appendChild(el);
            });

            const dock = document.getElementById('dockGrid');
            dock.innerHTML = '';
            dockApps.forEach((app) => {
                const el = document.createElement('div');
                el.className = 'app-item';
                el.innerHTML = `<div class="app-icon">${app.svg}</div>`;
                dock.appendChild(el);
            });
        }

        function onAppTapped(app, element) {
            if (thoughtApp) return;

            thoughtApp = app;

            const iconDiv = element.querySelector('.app-icon');
            const nameDiv = element.querySelector('.app-name');

            iconDiv.classList.add('flip');

            setTimeout(() => {
                iconDiv.innerHTML = intruderApp.svg;
                if (nameDiv) nameDiv.textContent = intruderApp.name;
                iconDiv.classList.remove('flip');
            }, 150);

            if (navigator.vibrate) navigator.vibrate(50);
        }

        function triggerWaveTransformation() {
            if (!thoughtApp || isTransformed) return;
            isTransformed = true;

            const allAppElements = document.querySelectorAll('.apps-grid .app-item, .dock-container .app-item');
            
            allAppElements.forEach((el, index) => {
                setTimeout(() => {
                    const iconDiv = el.querySelector('.app-icon');
                    const nameDiv = el.querySelector('.app-name');

                    iconDiv.innerHTML = thoughtApp.svg;
                    iconDiv.classList.add('flip');

                    if (nameDiv) {
                        nameDiv.textContent = thoughtApp.name;
                    }

                    setTimeout(() => iconDiv.classList.remove('flip'), 200);

                    if (navigator.vibrate) navigator.vibrate(20);
                }, index * 60);
            });
        }

        document.getElementById('secret-trigger').addEventListener('click', triggerWaveTransformation);

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchEndY - touchStartY > 50) {
                triggerWaveTransformation();
            }
        });

        renderApps();
    </script>
</body>
</html>
