<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iPhone Screen</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #000;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 47px) 20px env(safe-area-inset-bottom, 10px) 20px;
            position: relative;
        }

        /* GRID PRINCIPAL (4 COLUMNAS) */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 18px;
            margin-top: 15px;
            z-index: 1;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            object-fit: cover;
        }

        .app-name {
            color: #ffffff;
            font-size: 11px;
            margin-top: 5px;
            text-align: center;
            font-weight: 400;
            letter-spacing: -0.2px;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* DOCK PEGANTE ABAJO */
        .dock-wrapper {
            width: 100%;
            margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 5px);
            z-index: 1;
        }

        .dock-container {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: 32px;
            padding: 13px 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        /* BARRA HOME */
        .home-indicator {
            width: 135px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
            margin: 8px auto 2px auto;
        }

        .app-icon.flip {
            transform: scale(1.12) rotate(4deg);
        }

        /* BOTÓN INVISIBLE ESQUINA INFERIOR DERECHA */
        #secret-trigger {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 120px;
            height: 120px;
            z-index: 999;
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="secret-trigger"></div>

    <div class="apps-grid" id="appsGrid"></div>

    <div class="dock-wrapper">
        <div class="dock-container" id="dockGrid"></div>
        <div class="home-indicator"></div>
    </div>

    <script>
        // Logos e iconos oficiales PNG de iOS (Alta resolución)
        const ICONS = {
            photos: 'https://img.icons8.com/color/144/apple-photos.png',
            camera: 'https://img.icons8.com/color/144/apple-camera.png',
            mail: 'https://img.icons8.com/color/144/apple-mail.png',
            settings: 'https://img.icons8.com/color/144/ios-settings.png',
            notes: 'https://img.icons8.com/color/144/apple-notes.png',
            weather: 'https://img.icons8.com/color/144/apple-weather.png',
            clock: 'https://img.icons8.com/color/144/apple-clock.png',
            maps: 'https://img.icons8.com/color/144/apple-maps.png',
            health: 'https://img.icons8.com/color/144/apple-health.png',
            wallet: 'https://img.icons8.com/color/144/apple-wallet.png',
            appstore: 'https://img.icons8.com/color/144/apple-app-store.png',
            calculator: 'https://img.icons8.com/color/144/ios-calculator.png',
            
            // DOCK
            phone: 'https://img.icons8.com/color/144/apple-phone.png',
            safari: 'https://img.icons8.com/color/144/safari--v1.png',
            messages: 'https://img.icons8.com/color/144/apple-messages.png',
            music: 'https://img.icons8.com/color/144/apple-music.png'
        };

        const initialApps = [
            { id: 'photos', name: 'Fotos', icon: ICONS.photos },
            { id: 'camera', name: 'Cámara', icon: ICONS.camera },
            { id: 'mail', name: 'Mail', icon: ICONS.mail },
            { id: 'settings', name: 'Ajustes', icon: ICONS.settings },
            { id: 'notes', name: 'Notas', icon: ICONS.notes },
            { id: 'weather', name: 'Tiempo', icon: ICONS.weather },
            { id: 'clock', name: 'Reloj', icon: ICONS.clock },
            { id: 'maps', name: 'Mapas', icon: ICONS.maps },
            { id: 'health', name: 'Salud', icon: ICONS.health },
            { id: 'wallet', name: 'Cartera', icon: ICONS.wallet },
            { id: 'appstore', name: 'App Store', icon: ICONS.appstore }
        ];

        const intruderApp = { id: 'calculator', name: 'Calculadora', icon: ICONS.calculator };

        const dockApps = [
            { id: 'phone', name: 'Teléfono', icon: ICONS.phone },
            { id: 'safari', name: 'Safari', icon: ICONS.safari },
            { id: 'messages', name: 'Mensajes', icon: ICONS.messages },
            { id: 'music', name: 'Música', icon: ICONS.music }
        ];

        let thoughtApp = null;
        let isTransformed = false;

        function renderApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            
            initialApps.forEach((app) => {
                const el = document.createElement('div');
                el.className = 'app-item';
                el.onclick = () => onAppTapped(app, el);

                el.innerHTML = `
                    <div class="app-icon"><img src="${app.icon}"></div>
                    <div class="app-name">${app.name}</div>
                `;
                grid.appendChild(el);
            });

            const dock = document.getElementById('dockGrid');
            dock.innerHTML = '';
            dockApps.forEach((app) => {
                const el = document.createElement('div');
                el.className = 'app-item';
                el.innerHTML = `<div class="app-icon"><img src="${app.icon}"></div>`;
                dock.appendChild(el);
            });
        }

        function onAppTapped(app, element) {
            if (thoughtApp) return;

            thoughtApp = app;

            const iconDiv = element.querySelector('.app-icon');
            const nameDiv = element.querySelector('.app-name');

            iconDiv.classList.add('flip');

            setTimeout(() => {
                iconDiv.innerHTML = `<img src="${intruderApp.icon}">`;
                if (nameDiv) nameDiv.textContent = intruderApp.name;
                iconDiv.classList.remove('flip');
            }, 150);

            if (navigator.vibrate) navigator.vibrate(50);
        }

        function triggerWaveTransformation() {
            if (!thoughtApp || isTransformed) return;
            isTransformed = true;

            const allAppElements = document.querySelectorAll('.apps-grid .app-item, .dock-container .app-item');
            
            allAppElements.forEach((el, index) => {
                setTimeout(() => {
                    const iconDiv = el.querySelector('.app-icon');
                    const nameDiv = el.querySelector('.app-name');

                    iconDiv.innerHTML = `<img src="${thoughtApp.icon}">`;
                    iconDiv.classList.add('flip');

                    if (nameDiv) {
                        nameDiv.textContent = thoughtApp.name;
                    }

                    setTimeout(() => iconDiv.classList.remove('flip'), 200);

                    if (navigator.vibrate) navigator.vibrate(20);
                }, index * 60);
            });
        }

        document.getElementById('secret-trigger').addEventListener('click', triggerWaveTransformation);

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchEndY - touchStartY > 50) {
                triggerWaveTransformation();
            }
        });

        renderApps();
    </script>
</body>
</html>
